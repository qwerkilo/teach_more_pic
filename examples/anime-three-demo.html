<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨库组合 — Anime.js + Three.js</title>
<link rel="stylesheet" href="../libs/magicui-effects.css">
<script type="importmap">
{
  "imports": {
    "three": "../libs/three.module.js",
    "three/addons/": "../libs/three/",
    "animejs": "https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/modules/index.js",
    "animejs/": "https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/modules/"
  }
}
</script>
<style>
:root{--bg:#faf9f7;--text:#1a1a1a;--accent:#c0392b;--surface:#f5f0eb;--radius:8px;--font:"Noto Serif CJK SC",Georgia,serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);max-width:960px;margin:0 auto;padding:2rem;-webkit-font-smoothing:antialiased}
h1{border-bottom:2px solid var(--accent);padding-bottom:.5em}
h2{margin-top:2em}
.box{background:var(--surface);border-radius:var(--radius);margin:1rem 0;padding:8px;overflow:hidden;position:relative}
p{color:var(--muted);font-size:.9rem;margin:.5em 0}
.err{display:none;padding:1.5rem;text-align:center;color:#dc2626;background:#fef2f2;border-radius:6px;font-size:.85rem}
</style>
</head>
<body>
<h1 class="shiny-text">Anime.js + Three.js — 动画组合</h1>
<p>Anime.js 4.5+ Three.js Adapter 驱动 3D 对象属性动画，替代手写 requestAnimationFrame。</p>

<h2>示例一：弹跳柱状图</h2>
<p>Anime.js 驱动柱体从底部弹跳上升，同时旋转 + 颜色渐变。</p>
<div class="box border-glow"><div id="demo1" style="width:100%;height:400px;"></div><div class="err" id="err1"></div></div>

<h2>示例二：脉冲球体网络</h2>
<p>Anime.js 驱动球体的位置偏移 + 缩放 + 透明度，形成脉冲节奏。</p>
<div class="box border-glow"><div id="demo2" style="width:100%;height:400px;"></div><div class="err" id="err2"></div></div>

<noscript><p style="text-align:center;padding:2rem;">需要 JavaScript</p></noscript>

<script>
function showErr(id, msg){
  var el = document.getElementById(id);
  if(el){ el.style.display = 'block'; el.textContent = msg; }
}
</script>

<script type="module">
var THREE, animate, createTimer;

try {
  var m = await import('three');
  THREE = m;
} catch(e){ showErr('err1', 'Three.js 加载失败: ' + e.message); showErr('err2', 'Three.js 加载失败'); }

try {
  var a = await import('animejs');
  animate = a.animate; createTimer = a.createTimer;
  await import('animejs/adapters/three/index.js');
} catch(e){
  // Anime.js CDN failed — show info but don't block Three.js rendering
  var note = document.createElement('p');
  note.style.cssText = 'color:#d97706;font-size:.85rem;background:#fff7ed;padding:.5rem 1rem;border-radius:6px;';
  note.textContent = '⚠ Anime.js CDN 不可用，使用 rAF 替代动画';
  document.querySelector('.box:first-child').before(note);
}

if(!THREE) throw new Error('Three.js required');

/* ===== 示例一：弹跳柱状图 ===== */
(function(){
  try {
    var el = document.getElementById('demo1');
    if(!el) return;
    var w = el.clientWidth || 800, h = 400;

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(w, h); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    el.innerHTML = ''; el.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f0eb);

    var camera = new THREE.PerspectiveCamera(40, w/h, 0.1, 50);
    camera.position.set(6, 5, 10);
    camera.lookAt(0, 0, 0);

    var light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7); scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    var labels = ['中国','美国','日本','德国','英国','法国'];
    var targetHeights = [5.1, 3.2, 2.8, 4.5, 3.9, 3.0];
    var colors = [0xe74c3c,0x3498db,0x2ecc71,0xf39c12,0x9b59b6,0x1abc9c];
    var bars = [];

    targetHeights.forEach(function(v, i){
      var geo = new THREE.BoxGeometry(0.6, 0.01, 0.6);
      var mat = new THREE.MeshLambertMaterial({ color: colors[i] });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.position.set((i - 2.5) * 1.2, 0.005, 0);
      mesh.userData = { targetHeight: v, index: i, initialY: 0.005 };
      scene.add(mesh);
      bars.push(mesh);
    });

    var floor = new THREE.Mesh(
      new THREE.PlaneGeometry(8, 3),
      new THREE.MeshLambertMaterial({ color: 0xddd8d0, side: THREE.DoubleSide })
    );
    floor.rotation.x = -Math.PI / 2; floor.position.y = -0.05;
    scene.add(floor);

    if(animate){
      // Anime.js Drive
      bars.forEach(function(bar){
        animate(bar, {
          scaleY: [0.01, bar.userData.targetHeight],
          y: [0.005, bar.userData.targetHeight / 2],
          delay: bar.userData.index * 200,
          duration: 1200,
          ease: 'outBack(1.5)',
        });
      });
      animate(camera.position, {
        x: [6, -6],
        duration: 15000, loop: true, alternate: true, ease: 'inOutSine',
      });
    } else {
      // rAF fallback: simple entry animation
      var startTime = Date.now();
      bars.forEach(function(bar){
        var idx = bar.userData.index;
        var targetH = bar.userData.targetHeight;
        var delay = idx * 200;
        bar.userData.animStart = startTime + delay;
        bar.userData.initialScale = bar.scale.y;
        bar.userData.initialY = bar.position.y;
      });
      var animFrame = function(){
        var t = Date.now();
        bars.forEach(function(bar){
          var elapsed = t - (bar.userData.animStart || t);
          if(elapsed < 0) return;
          var progress = Math.min(elapsed / 1200, 1);
          var eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic
          var targetH = bar.userData.targetHeight;
          bar.scale.y = 0.01 + (targetH - 0.01) * eased;
          bar.position.y = (targetH / 2) * eased;
        });
        scene.rotation.y = Math.sin((t - startTime) * 0.0001) * 0.5;
        renderer.render(scene, camera);
        requestAnimationFrame(animFrame);
      };
      animFrame();
    }

    // Render loop
    if(createTimer){
      createTimer({ onUpdate: function(){ camera.lookAt(0, 0, 0); renderer.render(scene, camera); } });
    } else {
      (function rAF(){ requestAnimationFrame(rAF); camera.lookAt(0, 0, 0); renderer.render(scene, camera); })();
    }

    window.addEventListener('resize', function(){
      w = el.clientWidth;
      camera.aspect = w / h; camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
  } catch(e) { showErr('err1', 'Demo 1: ' + e.message); }
})();

/* ===== 示例二：脉冲球体网络 ===== */
(function(){
  try {
    var el = document.getElementById('demo2');
    if(!el) return;
    var w = el.clientWidth || 800, h = 400;

    var renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(w, h); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    el.innerHTML = ''; el.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f0eb);

    var camera = new THREE.PerspectiveCamera(50, w/h, 0.1, 50);
    camera.position.set(0, 2, 10); camera.lookAt(0, 0, 0);

    var light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(3, 5, 7); scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.3));

    var spheres = [];
    var gridSize = 5, spacing = 1.5;

    for(var i = 0; i < gridSize; i++){
      for(var j = 0; j < gridSize; j++){
        var geo = new THREE.SphereGeometry(0.3, 16, 12);
        var hue = (i / gridSize + j / gridSize) / 2;
        var color = new THREE.Color().setHSL(hue, 0.7, 0.6);
        var mat = new THREE.MeshLambertMaterial({ color: color });
        var mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(
          (i - (gridSize-1)/2) * spacing,
          (j - (gridSize-1)/2) * spacing,
          0
        );
        mesh.userData = { i: i, j: j, idx: i * gridSize + j };
        spheres.push(mesh);
      }
    }

    // Group spheres for rotation
    var sphereGroup = new THREE.Group();
    spheres.forEach(function(s){ sphereGroup.add(s); });
    scene.add(sphereGroup);

    if(animate){
      spheres.forEach(function(sph){
        var idx = sph.userData.idx;
        animate(sph, {
          scale: [
            { value: [0.8, 1.5], duration: 600 },
            { value: 0.8, duration: 600 }
          ],
          opacity: [
            { value: [0.4, 1], duration: 600 },
            { value: 0.4, duration: 600 }
          ],
          loop: true, delay: idx * 80, ease: 'inOutQuad',
        });
      });
      animate(sphereGroup.rotation, {
        y: [0, Math.PI * 2],
        duration: 20000, loop: true, ease: 'linear',
      });
    }

    if(createTimer){
      createTimer({ onUpdate: function(){ renderer.render(scene, camera); } });
    } else {
      (function rAF(){ requestAnimationFrame(rAF); renderer.render(scene, camera); })();
    }
  } catch(e) { showErr('err2', 'Demo 2: ' + e.message); }
})();
</script>
</body>
</html>
