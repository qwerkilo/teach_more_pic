<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨库组合 — Anime.js + Three.js</title>
<link rel="stylesheet" href="../libs/magicui-effects.css">
<script src="../libs/three.min.js"></script>
<style>
:root{--bg:#faf9f7;--text:#1a1a1a;--accent:#c0392b;--surface:#f5f0eb;--radius:8px;--font:"Noto Serif CJK SC",Georgia,serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);max-width:960px;margin:0 auto;padding:2rem;-webkit-font-smoothing:antialiased}
h1{border-bottom:2px solid var(--accent);padding-bottom:.5em}
h2{margin-top:2em}
.box{background:var(--surface);border-radius:var(--radius);margin:1rem 0;padding:8px;overflow:hidden;position:relative}
p{color:var(--muted);font-size:.9rem;margin:.5em 0}
.info-note{color:#d97706;font-size:.82rem;background:#fff7ed;padding:.4rem 1rem;border-radius:6px;margin-bottom:.5rem;}
</style>
</head>
<body>
<h1 class="shiny-text">Anime.js + Three.js — 动画组合</h1>
<p>Anime.js 4.5+ 通过 <code>animate(mesh, { scaleY: [0, 5], ease: 'outBack(1.5)' })</code> 一行驱动 Three.js 对象动画。</p>
<p class="info-note">直接打开文件时为 rAF 模式。运行 <code>start-server.ps1</code> 后 Anime.js 自动启用。</p>

<h2>示例一：弹跳柱状图</h2>
<p>柱体从底部弹跳上升，Anime.js easeOutBack 缓动。</p>
<div class="box"><div id="demo1" style="width:100%;height:400px;"></div><div class="err" id="err1" style="display:none;padding:1.5rem;text-align:center;color:#dc2626;background:#fef2f2;border-radius:6px;font-size:.85rem"></div></div>

<h2>示例二：脉冲球体网络</h2>
<p>球体缩放 + 透明度脉冲，Anime.js keyframe 序列。</p>
<div class="box"><div id="demo2" style="width:100%;height:400px;"></div><div class="err" id="err2" style="display:none;padding:1.5rem;text-align:center;color:#dc2626;background:#fef2f2;border-radius:6px;font-size:.85rem"></div></div>

<noscript><p style="text-align:center;padding:2rem;">需要 JavaScript</p></noscript>

<script>
function showErr(id, msg){
  var el = document.getElementById(id);
  if(el){ el.style.display = 'block'; el.textContent = msg; }
}

if(typeof THREE === 'undefined'){ showErr('err1','Three.js 未加载'); showErr('err2','Three.js 未加载'); }

/* ===== 检测 Anime.js（需要 HTTP 服务器） ===== */
var tryLoadAnime = function(){
  var s = document.createElement('script');
  s.type = 'module';
  s.textContent = [
    'try{',
      'var m=await import("https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/modules/index.js");',
      'window.__anime=m;',
      'try{await import("https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/modules/adapters/three/index.js");}catch(e){}',
    '}catch(e){}',
    'if(window.__anime) window.__animeReady=true;',
    'initDemos();',
  ].join('\n');
  s.onerror = function(){ initDemos(); };
  document.head.appendChild(s);
  setTimeout(function(){ if(!window.__animeReady) initDemos(); }, 3000);
};

function initDemos(){
  var ani = (window.__anime && window.__anime.animate) || null;

  /* ===== 示例一：弹跳柱状图 ===== */
  (function(){
    try {
      var el = document.getElementById('demo1');
      if(!el || typeof THREE === 'undefined') return;
      var w = el.clientWidth || 800, h = 400;

      var renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(w, h); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      el.innerHTML = ''; el.appendChild(renderer.domElement);

      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf5f0eb);
      var camera = new THREE.PerspectiveCamera(40, w/h, 0.1, 50);
      camera.position.set(6, 5, 10); camera.lookAt(0, 0, 0);

      var light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 10, 7); scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.4));

      var targetHeights = [5.1, 3.2, 2.8, 4.5, 3.9, 3.0];
      var colors = [0xe74c3c,0x3498db,0x2ecc71,0xf39c12,0x9b59b6,0x1abc9c];
      var bars = [];

      targetHeights.forEach(function(v, i){
        var geo = new THREE.BoxGeometry(0.6, 0.01, 0.6);
        var mat = new THREE.MeshLambertMaterial({ color: colors[i] });
        var mesh = new THREE.Mesh(geo, mat);
        mesh.position.set((i - 2.5) * 1.2, 0.005, 0);
        mesh.userData = { targetHeight: v, idx: i };
        scene.add(mesh);
        bars.push(mesh);
      });

      var floor = new THREE.Mesh(
        new THREE.PlaneGeometry(8, 3),
        new THREE.MeshLambertMaterial({ color: 0xddd8d0, side: THREE.DoubleSide })
      );
      floor.rotation.x = -Math.PI / 2; floor.position.y = -0.05;
      scene.add(floor);

      if(ani){
        bars.forEach(function(bar){
          ani(bar, {
            scaleY: [0.01, bar.userData.targetHeight],
            y: [0.005, bar.userData.targetHeight / 2],
            delay: bar.userData.idx * 200,
            duration: 1200,
            ease: 'outBack(1.5)',
          });
        });
      }

      var animTime = Date.now();
      (function rAF(){
        if(!ani){
          bars.forEach(function(bar){
            var t = Date.now() - animTime;
            var delay = bar.userData.idx * 200;
            var p = Math.min(Math.max((t - delay) / 1200, 0), 1);
            if(p <= 0) return;
            var e = 1 - Math.pow(1 - p, 3);
            var hh = bar.userData.targetHeight * e;
            bar.scale.y = 0.01 + hh;
            bar.position.y = hh / 2;
          });
          scene.rotation.y = Math.sin((Date.now() - animTime) * 0.0002) * 0.5;
        }
        camera.lookAt(0, 0, 0);
        renderer.render(scene, camera);
        requestAnimationFrame(rAF);
      })();

      window.addEventListener('resize', function(){
        w = el.clientWidth;
        camera.aspect = w / h; camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });
    } catch(e) { showErr('err1', 'Demo 1: ' + e.message); }
  })();

  /* ===== 示例二：脉冲球体网络 ===== */
  (function(){
    try {
      var el = document.getElementById('demo2');
      if(!el || typeof THREE === 'undefined') return;
      var w = el.clientWidth || 800, h = 400;

      var renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(w, h); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      el.innerHTML = ''; el.appendChild(renderer.domElement);

      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf5f0eb);
      var camera = new THREE.PerspectiveCamera(50, w/h, 0.1, 50);
      camera.position.set(0, 2, 10); camera.lookAt(0, 0, 0);

      var light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(3, 5, 7); scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 0.3));

      var spheres = [], gridSize = 5, spacing = 1.5;
      for(var i = 0; i < gridSize; i++){
        for(var j = 0; j < gridSize; j++){
          var geo = new THREE.SphereGeometry(0.3, 16, 12);
          var col = new THREE.Color().setHSL((i+j)/(gridSize*2-2), 0.7, 0.6);
          var mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: col }));
          mesh.position.set((i-(gridSize-1)/2)*spacing, (j-(gridSize-1)/2)*spacing, 0);
          mesh.userData = { idx: i * gridSize + j };
          spheres.push(mesh);
        }
      }

      var sphereGroup = new THREE.Group();
      spheres.forEach(function(s){ sphereGroup.add(s); });
      scene.add(sphereGroup);

      if(ani){
        spheres.forEach(function(sph){
          ani(sph, {
            scale: [{ value: [0.8, 1.5], duration: 600 }, { value: 0.8, duration: 600 }],
            opacity: [{ value: [0.4, 1], duration: 600 }, { value: 0.4, duration: 600 }],
            loop: true, delay: Math.random() * 1000, ease: 'inOutQuad',
          });
        });
      }

      var t0 = Date.now();
      (function rAF(){
        if(!ani){
          spheres.forEach(function(sph){
            var idx = sph.userData.idx;
            var phase = ((Date.now() - t0) * 0.003 + idx * 0.3) % (Math.PI * 2);
            var s = 1 + Math.sin(phase) * 0.35;
            sph.scale.setScalar(s);
            sph.material.opacity = 0.7 + Math.sin(phase) * 0.3;
            sph.material.transparent = true;
          });
          sphereGroup.rotation.y += 0.005;
        }
        renderer.render(scene, camera);
        requestAnimationFrame(rAF);
      })();
    } catch(e) { showErr('err2', 'Demo 2: ' + e.message); }
  })();
}

tryLoadAnime();
</script>
</body>
</html>
